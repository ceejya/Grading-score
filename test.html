<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Scorer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #1f2937;
        }

        .score-card {
            width: min(90%, 380px);
            padding: 28px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        p {
            margin: 0 0 22px;
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #checkbox {
            min-height: 24px;
            margin-top: 18px;
            font-size: 18px;
            font-weight: bold;
            color: #0f172a;
        }
    </style>
</head>

<body>
    <div class="score-card">
        <h1>Grade Scorer</h1>
        <p>Enter your score to check your grade.</p>
        <input type="number" id="inputValue" placeholder="Enter score">
        <button onclick="scoreChecker()">Check Grade</button>
        <div id="checkbox"></div>
    </div>



</body>

</html>
